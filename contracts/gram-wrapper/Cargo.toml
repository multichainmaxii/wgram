[package]
name = "gram-wrapper"
description = "1:1 NEP-141 wrapper for HOT Bridge GRAM (NEP-245), so Omni Bridge can carry GRAM to Solana"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/multichainmaxii/wgram"

[lib]
crate-type = ["cdylib", "rlib"]

# The mainnet wasm comes from `cargo near build reproducible-wasm` (Docker), so anyone
# can rebuild it from the commit recorded in `contract_source_metadata` and compare
# hashes. The image is pinned by digest; the tag is only a label.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.23.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
proptest = "1.11.0"
